<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#eee9dc" />
    <meta
      name="description"
      content="A quick practice game for recognizing Personal Jurisdiction and Subject Matter Jurisdiction."
    />
    <title>Personal Jurisdiction or Subject Matter Jurisdiction?</title>
    <link rel="icon" href="data:," />
    <link rel="stylesheet" href="styles.css" />
    <script src="app.js" defer></script>
  </head>
  <body>
    <main class="exercise" aria-labelledby="game-title">
      <header>
        <h1 id="game-title">Personal Jurisdiction or Subject Matter Jurisdiction?</h1>
      </header>

      <section id="home-screen" class="home-screen" aria-labelledby="home-prompt">
        <p id="home-prompt">Which kind of jurisdiction is at issue?</p>
        <button id="start-button" class="primary-button" type="button">Start Game</button>
      </section>

      <section id="play-screen" class="play-screen" aria-label="Current question" hidden>
        <p id="progress" class="progress">1 of 10</p>

        <article id="question-card" class="question-card" tabindex="-1">
          <h2 id="question-text"></h2>
        </article>

        <div class="answer-panel" aria-label="Answer choices">
          <button class="answer-button" type="button" data-answer="personal">
            Personal Jurisdiction
          </button>
          <button class="answer-button" type="button" data-answer="subject">
            Subject Matter Jurisdiction
          </button>
        </div>

        <section id="feedback" class="feedback" aria-live="polite" aria-atomic="true" hidden>
          <h3 id="feedback-title"></h3>
          <p id="feedback-text"></p>
          <button id="next-button" class="primary-button" type="button">Next Card</button>
        </section>
      </section>

      <section id="end-screen" class="end-screen" aria-labelledby="end-title" hidden>
        <h2 id="end-title"><span id="final-score">0 of 10</span> correct</h2>
        <div class="rule-review">
          <p>
            <strong>Personal Jurisdiction</strong>
            <span>Authority over the defendant.</span>
          </p>
          <p>
            <strong>Subject Matter Jurisdiction</strong>
            <span>Authority to hear this type of case.</span>
          </p>
        </div>
        <button id="play-again-button" class="primary-button" type="button">Play Again</button>
      </section>

      <noscript>This game needs JavaScript to shuffle cards and check answers.</noscript>
    </main>
  </body>
</html>
